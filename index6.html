<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form >
        <label for="username"></label>
        <input  placeholder="Enter your username" type="text" id="username" name="username" required><br><br>
        <label for="age"></label>
        <input placeholder="Enter your age" type="number" id="age" name="age" required><br><br>
        <label for="password"></label>
        <input  placeholder="Enter your password" type="password" id="password" name="password" required><br><br>
        <label for="write-anything"></label>
        <textarea placeholder="Write anything" id="write-anything" name="write-anything" required></textarea><br><br>
        <label for="country"></label>
        <select id="country" name="country" required>
            <option value="">Select a country</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
            <option value="iraq">Iraq</option>
        </select><br><br>
        <label for="male">male</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="female">female</label>
        <input type="radio" id="female" name="gender" value="female" required><br><br>
        <label for="are-you-sure"></label>
        <input type="checkbox" id="are-you-sure" name="are-you-sure" required><br><br>
        <button type="submit">login</button>

    </form>
        
</body>
</html>
